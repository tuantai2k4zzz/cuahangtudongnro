<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sphere background gradient -->
    <radialGradient id="dragonBallGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF785" />
      <stop offset="20%" stop-color="#FFA800" />
      <stop offset="65%" stop-color="#FF5100" />
      <stop offset="92%" stop-color="#C81500" />
      <stop offset="100%" stop-color="#7A0000" />
    </radialGradient>
    <!-- Top-left specular gloss highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <!-- Drop shadow for stars -->
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.4" dy="0.8" stdDeviation="0.5" flood-color="#440000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Outer rim subtle dark glow -->
  <circle cx="32" cy="32" r="31" fill="#7A0000" />

  <!-- Main Dragon Ball Sphere -->
  <circle cx="32" cy="32" r="30" fill="url(#dragonBallGrad)" />

  <!-- 4 Iconic Ruby Red Stars (Tu Tinh Cau - 4 Star Dragon Ball) -->
  <!-- Top star -->
  <polygon points="32,15 33.8,19.8 38.8,20 34.8,23.2 36.3,28 32,25.2 27.7,28 29.2,23.2 25.2,20 30.2,19.8" fill="#E80000" stroke="#880000" stroke-width="0.6" filter="url(#starShadow)" />
  
  <!-- Left star -->
  <polygon points="23,26 24.8,30.8 29.8,31 25.8,34.2 27.3,39 23,36.2 18.7,39 20.2,34.2 16.2,31 21.2,30.8" fill="#E80000" stroke="#880000" stroke-width="0.6" filter="url(#starShadow)" />

  <!-- Right star -->
  <polygon points="41,26 42.8,30.8 47.8,31 43.8,34.2 45.3,39 41,36.2 36.7,39 38.2,34.2 34.2,31 39.2,30.8" fill="#E80000" stroke="#880000" stroke-width="0.6" filter="url(#starShadow)" />

  <!-- Bottom star -->
  <polygon points="32,37 33.8,41.8 38.8,42 34.8,45.2 36.3,50 32,47.2 27.7,50 29.2,45.2 25.2,42 30.2,41.8" fill="#E80000" stroke="#880000" stroke-width="0.6" filter="url(#starShadow)" />

  <!-- 3D Glass Specular Reflection on Upper Sphere -->
  <ellipse cx="25" cy="18" rx="14" ry="7" transform="rotate(-30, 25, 18)" fill="url(#glossGrad)" />
  <circle cx="20" cy="15" r="2.2" fill="#FFFFFF" opacity="0.95" />
  <!-- Bottom subtle rim bounce reflection -->
  <ellipse cx="42" cy="46" rx="9" ry="3" transform="rotate(-30, 42, 46)" fill="#FFFFFF" opacity="0.18" />
</svg>
